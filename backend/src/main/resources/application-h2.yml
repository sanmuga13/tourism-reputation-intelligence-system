server:
  port: ${PORT:8080}

spring:
  application:
    name: trip-backend

  datasource:
    url: jdbc:h2:mem:trip_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# AI Service (Python FastAPI)
ai:
  service:
    base-url: ${AI_SERVICE_URL:${AI_URL:http://localhost:8000}}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# Logging
logging:
  level:
    com.trip: DEBUG
    org.springframework.web: INFO
