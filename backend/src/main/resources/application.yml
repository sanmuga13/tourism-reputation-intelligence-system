server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  application:
    name: trip-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/trip_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:trip_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:trip_password}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# AI Service (Python FastAPI)
ai:
  service:
    base-url: ${AI_SERVICE_URL:${AI_URL:http://localhost:8000}}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# Logging
logging:
  level:
    com.trip: INFO
    org.springframework.web: INFO
